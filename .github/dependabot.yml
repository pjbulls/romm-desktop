version: 2
updates:
  # Security fixes arrive as their own pull requests whatever this says; these are the routine updates.
  # Minor and patch bumps are grouped so a week's worth is one pull request, not twenty.
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The workflows pin actions to commit SHAs (with the version in a comment); this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
