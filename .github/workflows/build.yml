name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: System libraries (Tauri), QEMU (disk-image tests), keychain and e2e tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev libdbus-1-dev \
            qemu-utils gnome-keyring dbus-user-session xvfb webkit2gtk-driver python3-pil
      - run: npm ci && npm test && npm run build
        working-directory: app
      - run: cargo test --workspace --lib --tests --locked
      - name: OS keychain, against a real Secret Service (GNOME Keyring)
        run: |
          dbus-run-session -- bash -ec '
            eval "$(echo -n ci | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            cargo test --workspace --lib --locked real_os_keychain -- --ignored
          '
      - name: Build the CLI (debug)
        id: cli
        if: ${{ !cancelled() }}
        run: cargo build --locked -p romm-cli
      - name: CLI smoke test
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        run: tests/smoke/psp_smoke.sh
      - name: Build the app (debug, embedded frontend)
        id: app
        run: npm run tauri build -- --debug --no-bundle
        working-directory: app
      - name: e2e drive.py
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: OUT=/tmp/e2e-drive tests/e2e/run.sh
      - name: e2e drive_pad.py
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: DRIVER=drive_pad.py OUT=/tmp/e2e-pad tests/e2e/run.sh
      - name: e2e drive_choices.py
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: DRIVER=drive_choices.py OUT=/tmp/e2e-choices tests/e2e/run.sh
      - name: e2e drive_versions.py
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: DRIVER=drive_versions.py OUT=/tmp/e2e-versions tests/e2e/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: e2e-logs
          path: /tmp/e2e-*
          if-no-files-found: warn

  keychain-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Keychain logic (this also compiles the Credential Manager backend)
        run: cargo test -p romm-core --lib --locked token_store
      - name: Credential Manager, for real
        continue-on-error: true
        run: cargo test -p romm-core --lib --locked real_os_keychain -- --ignored

  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Re-vendor at the pinned commit and require no difference
        run: |
          pin=$(awk '$1=="argosy-sigil"{print $2}' crates/sigil-sys/vendor/PINNED)
          test -n "$pin" || { echo "::error::no argosy-sigil line in vendor/PINNED"; exit 1; }
          sh crates/sigil-sys/scripts/update-vendor.sh "$pin"
          if [ -n "$(git status --porcelain -- crates/sigil-sys/vendor)" ]; then
            echo "::error::crates/sigil-sys/vendor differs from argosy-sigil $pin (vendored copy was edited, or PINNED is wrong)"
            git status --short -- crates/sigil-sys/vendor
            exit 1
          fi

  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     bundle: deb,  ext: deb, arch: amd64, suffix: "" }
          - { os: ubuntu-24.04-arm, bundle: deb,  ext: deb, arch: arm64, suffix: "" }
          - { os: windows-latest,   bundle: nsis, ext: exe, arch: x64,   suffix: "-setup" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: System libraries for Tauri
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - run: npm ci
        working-directory: app
      - name: Build the installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
        working-directory: app
      - name: Name the installer
        env:
          BUNDLE: ${{ matrix.bundle }}
          EXT: ${{ matrix.ext }}
          ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          # Tauri names it "<productName>_<version>_<arch>.<ext>". The name published here has no version
          # in it, so a link to it keeps working from one build to the next.
          shopt -s nullglob
          built=(target/release/bundle/"$BUNDLE"/*."$EXT")
          if [ "${#built[@]}" -ne 1 ]; then
            echo "::error::expected one .$EXT in target/release/bundle/$BUNDLE, found ${#built[@]}"
            ls -R target/release/bundle || true
            exit 1
          fi
          mkdir dist
          cp "${built[0]}" "dist/romm-desktop_${ARCH}${SUFFIX}.${EXT}"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.arch }}-${{ matrix.ext }}
          path: dist/*
          if-no-files-found: error
      - name: Build the standalone CLI
        run: cargo build --release --locked -p romm-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: romm-cli-${{ matrix.os }}
          path: |
            target/release/romm
            target/release/romm.exe
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-installers
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Publish to the installers branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote() { git -c "http.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          # If main has moved on, the run for the newer commit will publish; do not put an older build over it.
          head=$(remote ls-remote "$url" refs/heads/main | cut -f1)
          if [ "$head" != "$SOURCE_SHA" ]; then
            echo "main is now at $head, not $SOURCE_SHA; leaving the installers to that run"
            exit 0
          fi
          cd dist
          sha256sum -- *.deb *.exe > SHA256SUMS.txt
          {
            echo "commit  $SOURCE_SHA"
            echo "built   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run     $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > BUILD.txt
          {
            echo "# Installers"
            echo
            echo "The newest build of RomM Desktop from \`main\` (commit \`$SOURCE_SHA\`), replaced every push."
            echo "This branch is not appended but overwritten: it has no history. \`BUILD.txt\` declares the commit that"
            echo "built these files and \`SHA256SUMS.txt\` has their checksums. The Windows installer is not signed."
          } > README.md
          git init -q -b installers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .
          git commit -q -m "Installers built from $SOURCE_SHA"
          remote push --force "$url" HEAD:refs/heads/installers
