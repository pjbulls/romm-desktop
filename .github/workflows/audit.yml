name: audit
on:
  # Weekly as well as on changes: advisories are published without any commit here, and this is how
  # a new one in an existing dependency gets noticed.
  schedule: [{ cron: '23 5 * * 1' }]
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      # Fails on vulnerabilities. Unmaintained and unsound crates are printed as warnings: the ones there
      # now come from Tauri's GTK3 bindings and cannot be changed from here (see .cargo/audit.toml).
      - run: cargo audit

  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # What ships: the app bundles only these four packages, so this is the check that fails the run.
      - name: Production dependencies
        run: npm audit --omit=dev --package-lock-only --audit-level=high
        working-directory: app
      # Build and test tooling (vite, vitest) never reaches the shipped app, and an advisory there can be one
      # nobody has fixed yet (picomatch, when this was written: no patched version exists). It is shown,
      # so that it is seen, but does not fail the run.
      - name: Dev tooling (informational)
        continue-on-error: true
        run: npm audit --package-lock-only --audit-level=high
        working-directory: app
