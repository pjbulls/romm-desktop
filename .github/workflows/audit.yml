name: audit
on:
  schedule: [{ cron: '23 5 * * 1' }]
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit

  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Production dependencies
        run: npm audit --omit=dev --package-lock-only --audit-level=high
        working-directory: app
      - name: Dev tooling (informational)
        continue-on-error: true
        run: npm audit --package-lock-only --audit-level=high
        working-directory: app
