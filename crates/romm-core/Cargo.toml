[package]
name = "romm-core"
description = "UI-independent core for a RomM desktop client: API, emulator profiles, save sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
md-5.workspace = true
hex.workspace = true
zip.workspace = true
flate2.workspace = true
walkdir.workspace = true
directories.workspace = true
futures-util.workspace = true
chrono.workspace = true
tracing.workspace = true
tokio-util.workspace = true
base64.workspace = true
keyring-core = "1"
sigil-sys = { path = "../sigil-sys" }

# QEMU (and so xemu) guards its disk images with byte-range locks on Linux; see `xbox::lock`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The API token lives in the OS keychain (see `token_store`): the Secret Service over libdbus on Linux (the
# synchronous store: no async runtime to match, and libdbus is already there wherever GTK is) and the
# Credential Manager on Windows. `crypto-rust` keeps OpenSSL out of the build.
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
