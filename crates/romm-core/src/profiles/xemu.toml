id = "xemu"
name = "xemu"
# Original Xbox only. Xbox 360 (`xbox360`) is deliberately not claimed: its emulator
# (Xenia) is effectively Windows-only.
platforms = ["xbox"]

[detect]
linux_bins = ["xemu"]
windows_exes = [
  "{programfiles}/xemu/xemu.exe",
  "{localappdata}/Programs/xemu/xemu.exe",
]
flatpak_id = "app.xemu.xemu"

# `-dvd_path <iso>` is xemu's documented CLI argument (https://xemu.app/docs/cli/).
# Add `-full-screen` via the per-emulator extra args if wanted.
[launch]
args = ["-dvd_path", "{rom}"]

# xemu uses SDL_GetPrefPath("xemu", "xemu"), or the folder holding xemu.toml when
# that file sits next to the executable (portable mode).
[data]
linux = ["{xdg_data}/xemu/xemu"]
flatpak = ["{home}/.var/app/app.xemu.xemu/data/xemu/xemu"]
windows = [
  { path = "{exe_dir}", requires = "{exe_dir}/xemu.toml" },
  "{appdata}/xemu/xemu",
]

# Saves are the `E:\UDATA\<title id>` folders inside the virtual hard disk (`hdd_path` in
# xemu.toml, usually xbox_hdd.qcow2), so they are read out of the image by title id rather than
# found as files (see `xbox`). One game's save travels as `<TITLE ID>.zip`, as Argosy's does.
#
# UPLOAD ONLY, for now: nothing here writes to the image, so a save RomM holds is never put
# back into xemu. Rewriting a multi-GB disk that the emulator also writes needs its own care.
[saves]
mode = "hdd"

# There is intentionally no [states] or [bios] section.
#
# * xemu's snapshots live inside the same disk image, so neither `diff` nor `stem` mode can see
#   them. Syncing the whole image as one unit would turn any conflict between two devices into
#   a whole-disk conflict.
# * xemu takes its BIOS, boot ROM and HDD image from paths configured inside xemu
#   itself, so there is no BIOS folder to install into.
